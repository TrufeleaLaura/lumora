name: Lumora

options:
  bundleIdPrefix: app.lumora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # Pure Swift model layer: edit document, history, presets, math. No UIKit.
  LumoraCore:
    type: framework
    platform: iOS
    sources: [Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumora.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # Pixel loops (fills, warps, brushes) are far too slow unoptimized, even in test builds.
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  # Rendering + AI: Core Image graph, Metal Core Image kernels, Vision/Core ML services.
  LumoraEngine:
    type: framework
    platform: iOS
    sources: [Engine]
    dependencies:
      - target: LumoraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumora.engine
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        # All .metal files in this target are Core Image kernels.
        MTL_COMPILER_FLAGS: "-fcikernel"
        MTLLINKER_FLAGS: "-cikernel"

  Lumora:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: LumoraCore
      - target: LumoraEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lumora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Lumora shows your photos so you can choose one to edit.
        NSPhotoLibraryAddUsageDescription: Lumora saves your edited photos to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumora.editor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  LumoraCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CoreTests]
    dependencies:
      - target: LumoraCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lumora.core-tests

  LumoraEngineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EngineTests
      - path: Fixtures/Photos
        type: folder
        buildPhase: resources
    dependencies:
      - target: LumoraCore
      - target: LumoraEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lumora.engine-tests

  # Scripted walkthrough of the app that saves a screenshot of every tool.
  LumoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    dependencies:
      - target: Lumora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lumora.ui-tests
        TEST_TARGET_NAME: Lumora

schemes:
  Lumora:
    build:
      targets:
        Lumora: all
        LumoraCoreTests: [test]
        LumoraEngineTests: [test]
        LumoraUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LumoraCoreTests
        - LumoraEngineTests
        - LumoraUITests
    archive:
      config: Release
